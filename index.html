<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PitLap - 赛车圈速助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F5F5;color:#1A1A1A;max-width:420px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{display:none}

/* Header */
.header{background:#fff;padding:12px 16px;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#E60012,#FF3333,#E60012,#1A1A1A)}
.header::after{content:'';position:absolute;bottom:0;right:20px;width:80px;height:20px;opacity:.06;background:repeating-linear-gradient(45deg,#000 0,#000 2px,transparent 2px,transparent 4px)}
.header h1{font-size:20px;font-weight:800;color:#1A1A1A;letter-spacing:1px}
.header h1 span{color:#E60012}
.header-badge{font-size:11px;color:#999;background:#F0F0F0;padding:3px 8px;border-radius:10px;font-weight:600}

/* Checkered accent bar */
.checkered{height:4px;background:repeating-linear-gradient(90deg,#1A1A1A 0,#1A1A1A 6px,#fff 6px,#fff 12px);flex-shrink:0}

/* Content */
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:8px;display:flex;flex-direction:column;gap:14px}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #EEEEEE;position:relative}
.card-title{font-size:13px;color:#888;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}
.card-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-red{background:#E60012}
.dot-black{background:#1A1A1A}

/* Vehicle Card */
.vehicle-card{background:#fff;border-left:4px solid #E60012;position:relative;overflow:hidden}
.vehicle-card::after{content:'🏁';position:absolute;right:12px;top:12px;font-size:24px;opacity:.3}
.vehicle-card .racing-line{position:absolute;bottom:0;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#E60012 0,#E60012 8px,transparent 8px,transparent 16px)}
.vehicle-name{font-size:22px;font-weight:800;color:#1A1A1A;margin-bottom:4px}
.vehicle-sub{font-size:12px;color:#888;margin-bottom:12px}
.vehicle-stats{display:flex;gap:16px}
.vehicle-stat{text-align:center;flex:1;background:#F8F8F8;border-radius:8px;padding:8px 6px}
.vehicle-stat .num{font-size:18px;font-weight:800;color:#E60012}
.vehicle-stat .label{font-size:11px;color:#888;margin-top:2px;font-weight:500}

/* Tire */
.tire-bar{height:6px;background:#E8E8E8;border-radius:3px;margin-top:8px;overflow:hidden}
.tire-fill{height:100%;border-radius:3px}
.tire-fill.good{background:linear-gradient(90deg,#E60012,#FF6B00)}
.tire-fill.warn{background:linear-gradient(90deg,#CC0000,#E60012)}
.tire-info{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:4px}

/* Lap */
.lap-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0}
.lap-item:last-child{border-bottom:none}
.lap-track{font-size:14px;font-weight:700;color:#1A1A1A}
.lap-track-sub{font-size:11px;color:#999;margin-top:2px}
.lap-time{font-size:18px;font-weight:800;color:#E60012;font-variant-numeric:tabular-nums}
.lap-time.best{color:#1A1A1A}
.lap-time.best::after{content:' PB';font-size:10px;color:#1A1A1A;font-weight:700;background:#F0F0F0;padding:1px 5px;border-radius:4px;margin-left:4px}

/* Chart */
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100px;padding-top:14px;border-bottom:2px solid #E5E5E5}
.chart-bar{flex:1;border-radius:4px 4px 0 0;min-height:8px;position:relative;background:linear-gradient(180deg,#E60012,#FF5555)}
.chart-bar.best{background:linear-gradient(180deg,#1A1A1A,#444)}
.chart-bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:8px;color:#888;white-space:nowrap;font-weight:600}
.chart-labels{display:flex;gap:4px;margin-top:6px}
.chart-labels span{flex:1;font-size:8px;color:#999;text-align:center;font-weight:500}

/* Tabs */
.tabs{display:flex;background:#fff;border-top:2px solid #E5E5E5;flex-shrink:0;padding:4px 0 env(safe-area-inset-bottom,6px) 0;position:relative}
.tabs::before{content:'';position:absolute;top:-2px;left:10%;right:10%;height:2px;background:repeating-linear-gradient(90deg,#E60012 0,#E60012 8px,transparent 8px,transparent 16px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;cursor:pointer;transition:.15s;border:none;background:none;color:#999}
.tab svg{width:22px;height:22px}
.tab span{font-size:10px;font-weight:600}
.tab.active{color:#E60012}
.tab.active svg{color:#E60012;fill:#E60012}

/* Mods */
.mod-tags{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mod-tag{padding:6px 14px;border-radius:16px;font-size:12px;background:#F0F0F0;color:#888;white-space:nowrap;cursor:pointer;transition:.15s;border:none;font-weight:600}
.mod-tag.active{background:#E60012;color:#fff}
.lap-tag{padding:6px 14px;border-radius:16px;font-size:12px;background:#F0F0F0;color:#888;white-space:nowrap;cursor:pointer;transition:.15s;border:none;font-weight:600}
.lap-tag.active{background:#E60012;color:#fff}
.mod-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0}
.mod-item:last-child{border-bottom:none}
.mod-name{font-size:14px;font-weight:700;color:#1A1A1A}
.mod-cat{font-size:10px;color:#E60012;background:#FFF0F0;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:3px;font-weight:600}
.mod-price{font-size:15px;font-weight:700;color:#E60012}
.mod-date{font-size:10px;color:#999;text-align:right}

/* Expenses */
.expense-summary{display:flex;gap:12px;margin-bottom:4px}
.expense-stat{flex:1;text-align:center;background:#F8F8F8;border-radius:10px;padding:12px;border:1px solid #EEEEEE}
.expense-stat .num{font-size:20px;font-weight:800;color:#E60012}
.expense-stat .label{font-size:11px;color:#888;margin-top:2px;font-weight:500}
.expense-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0}
.expense-item:last-child{border-bottom:none}
.expense-left{display:flex;align-items:center;gap:10px}
.expense-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#F8F8F8}
.expense-name{font-size:14px;font-weight:600}
.expense-date{font-size:11px;color:#999}
.expense-amount{font-size:15px;font-weight:700;color:#E60012}

/* Pie */
.pie-placeholder{width:100px;height:100px;border-radius:50%;margin:0 auto;background:conic-gradient(#E60012 0% 35%,#1A1A1A 35% 55%,#FF6B00 55% 70%,#CCC 70% 85%,#555 85% 100%);position:relative;flex-shrink:0}
.pie-placeholder::after{content:'';position:absolute;inset:20px;border-radius:50%;background:#fff}


/* === Vehicle Management === *//* FAB */
.fab{position:fixed;bottom:76px;right:calc(50% - 210px + 16px);width:48px;height:48px;border-radius:50%;background:#E60012;color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(230,0,18,.35);display:flex;align-items:center;justify-content:center;z-index:10;transition:.15s;font-weight:700}
.fab:active{transform:scale(.92)}
@media(max-width:420px){.fab{right:16px}}

/* Misc */
.divider{height:1px;background:#F0F0F0;margin:4px 0}
.section-title{font-size:13px;color:#888;margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.legend span{font-size:11px;color:#888;font-weight:500}
.legend span em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}

/* Racing stripe decoration */
.racing-stripe{height:3px;background:repeating-linear-gradient(90deg,#1A1A1A 0,#1A1A1A 6px,#fff 6px,#fff 12px);margin:8px 0 4px;border-radius:1px}

/* === PB Cards === */
.pb-card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #EEEEEE;position:relative;overflow:hidden}
.pb-card:not(:last-child){margin-bottom:10px}
.pb-card .pb-badge{font-size:11px;font-weight:700;display:inline-block;padding:2px 10px;border-radius:10px;margin-bottom:6px}
.pb-badge.most{background:#1A1A1A;color:#fff}
.pb-badge.hot{background:#E60012;color:#fff}
.pb-badge.newb{background:#FFF0F0;color:#E60012;border:1px solid #E60012}
.pb-card .pb-track{font-size:18px;font-weight:800;color:#1A1A1A}
.pb-card .pb-time{font-size:20px;font-weight:800;color:#E60012;margin:2px 0}
.pb-card .pb-target{display:flex;align-items:baseline;gap:6px;font-size:13px;color:#888}
.pb-card .pb-gap{font-size:24px;font-weight:800;margin-left:auto}
.pb-card .pb-gap.red{color:#E60012}
.pb-card .pb-gap.green{color:#00AA55}
.pb-gap-unit{font-size:13px;font-weight:600}

/* === Lap List === */
.lap-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0F0F0}
.lap-list-item:last-child{border-bottom:none}
.lli-left{display:flex;flex-direction:column;gap:2px}
.lli-date{font-size:11px;color:#999;font-weight:500}
.lli-track{font-size:14px;font-weight:700;color:#1A1A1A}
.lli-vehicle{font-size:11px;color:#999}
.lli-time{font-size:18px;font-weight:800;color:#E60012;margin-right:6px}
.lli-actions{display:flex;gap:6px;align-items:center}
.lli-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.1s;background:transparent;color:#999}
.lli-btn:hover{background:#F0F0F0}
.lli-btn.edit{color:#1A1A1A}
.lli-btn.del{color:#E60012}
.lap-list-main{display:flex;align-items:center;flex:1}
.lap-list-right{display:flex;align-items:center;gap:4px;flex-shrink:0}

/* === Leaderboard === */
.leaderboard-page{padding:20px;padding-bottom:80px}
.lb-header{text-align:center;margin-bottom:20px}
.lb-track-select{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.lb-track-btn{padding:6px 16px;border-radius:20px;border:1.5px solid #DDD;background:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:#666;transition:.15s}
.lb-track-btn.active{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.lb-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.lb-rank{width:28px;text-align:center;font-weight:800;font-size:16px;flex-shrink:0}
.lb-rank.gold{color:#FFD700}
.lb-rank.silver{color:#C0C0C0}
.lb-rank.bronze{color:#CD7F32}
.lb-rank.other{color:#999}
.lb-avatar{width:40px;height:40px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#1A1A1A;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:14px;font-weight:700;color:#1A1A1A}
.lb-vehicle{font-size:11px;color:#999;margin-top:1px}
.lb-right{text-align:right;flex-shrink:0}
.lb-time{font-size:18px;font-weight:800;color:#E60012}
.lb-gap{font-size:11px;color:#999;margin-top:1px}


/* === My Vehicles Page === */
/* === Confirm Dialog === */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:2000;display:none;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;padding:24px;width:280px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.confirm-msg{font-size:15px;color:#1A1A1A;margin-bottom:20px;line-height:1.5;white-space:pre-line}
.confirm-actions{display:flex;gap:10px;justify-content:center}
.confirm-btn{padding:8px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.confirm-btn.cancel{background:#F0F0F0;color:#666}
.confirm-btn.danger{background:#E60012;color:#fff}

/* === My Vehicles Page === */
.mv-top{height:33vh;min-height:200px;position:relative;display:flex;flex-direction:column}
.mv-vehicle-switcher{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;flex-shrink:0;-webkit-overflow-scrolling:touch}
.mv-vehicle-switcher::-webkit-scrollbar{display:none}
.mv-switch-tag{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid #DDD;background:#fff;color:#888;transition:.15s;flex-shrink:0}
.mv-switch-tag.active{background:#E60012;color:#fff;border-color:#E60012}
.mv-vehicle-card{flex:1;background:#fff;margin:8px 16px;border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden}
.mv-vehicle-photo{width:90px;height:68px;border-radius:8px;background:#F5F5F5;border:1px solid #E5E5E5;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mv-vehicle-photo img{width:100%;height:100%;object-fit:cover}
.mv-vehicle-info{flex:1;min-width:0}
.mv-vehicle-name{font-size:17px;font-weight:800;color:#1A1A1A;margin-bottom:2px}
.mv-vehicle-detail{font-size:12px;color:#888;font-weight:500}
.mv-vehicle-detail span{color:#E60012;font-weight:700}
.mv-mod-section{border-top:1px solid #F0F0F0}
.mv-mod-header{display:flex;flex-direction:column;gap:6px;padding:14px 16px 8px}
.mv-mod-title{font-size:14px;font-weight:700;color:#1A1A1A;white-space:nowrap}
.mv-mod-tags{display:flex;gap:6px;overflow-x:auto}
.mv-mod-tag{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #DDD;background:#fff;color:#888;white-space:nowrap;transition:.15s}
.mv-mod-tag.active{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.mv-mod-list{padding:0 16px 16px}
.mv-mod-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F5F5F5}
.mv-mod-item:last-child{border-bottom:none}
.mv-mod-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mv-mod-icon{width:34px;height:34px;border-radius:8px;background:#F8F8F8;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.mv-mod-name{font-size:14px;font-weight:600;color:#1A1A1A}
.mv-mod-date{font-size:11px;color:#BBB;margin-top:1px}
.mv-mod-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mv-mod-price{font-size:14px;font-weight:700;color:#E60012;white-space:nowrap}
.mv-mod-cat{font-size:10px;background:#F0F0F0;color:#888;padding:2px 7px;border-radius:8px;font-weight:600}
.mv-mod-actions{display:flex;gap:2px}
.mv-mod-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;background:transparent;color:#999;transition:.1s}
.mv-mod-btn:hover{background:#F0F0F0}
.mv-mod-btn.edit{color:#1A1A1A}

/* === Modal === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-end;animation:fadeIn .2s ease}
.modal-overlay.show{display:flex}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,10px));animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;color:#1A1A1A}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:#888;margin-bottom:5px;display:block}
.form-row{display:flex;gap:8px;align-items:center}
.form-row .form-group{flex:1;margin-bottom:0}
.form-input,.form-select{width:100%;padding:10px 12px;border:1px solid #DDD;border-radius:8px;font-size:14px;background:#FAFAFA;color:#1A1A1A;outline:none;transition:.15s}
.form-input:focus,.form-select:focus{border-color:#E60012;background:#fff}
.form-input-sm{padding:8px 10px;font-size:14px;text-align:center}
.unit-label{font-size:12px;color:#999;font-weight:500;white-space:nowrap}

/* Multi-select tags */
.tag-grid{display:flex;flex-wrap:wrap;gap:6px}
.tag-opt{padding:6px 14px;border-radius:16px;font-size:12px;background:#F0F0F0;color:#888;cursor:pointer;border:none;font-weight:600;transition:.15s}
.tag-opt.active{background:#E60012;color:#fff}
.tag-opt:active{transform:scale(.95)}

/* Modal buttons */
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-cancel{background:#F0F0F0;color:#888}
.btn-submit{background:#E60012;color:#fff}
.btn-submit:disabled{opacity:.4}

/* FAB Menu */
.fab-menu{position:fixed;bottom:136px;right:calc(50% - 210px + 16px);display:none;flex-direction:column;gap:8px;z-index:11}
.fab-menu.show{display:flex}
@media(max-width:420px){.fab-menu{right:16px}}
.fab-menu-item{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:24px;border:none;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.15);transition:.15s;background:#fff;color:#1A1A1A}
.fab-menu-item:active{transform:scale(.94)}
.fab-menu-item .fab-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fab-icon.vehicle{background:#1A1A1A;color:#fff}
.fab-icon.mod{background:#E60012;color:#fff}
.fab-overlay{position:fixed;inset:0;z-index:10;display:none}
.fab-overlay.show{display:block}

/* Mod Modal */
#mod-modal .form-select, #mod-modal .form-input{width:100%;padding:10px 12px;border:1px solid #DDD;border-radius:8px;font-size:14px;background:#FAFAFA;color:#1A1A1A;outline:none}
#mod-modal .form-select:focus, #mod-modal .form-input:focus{border-color:#E60012;background:#fff}
.modal-delete{width:100%;margin-top:20px;border-top:1px solid #F0F0F0;padding-top:16px;display:none}
.modal-delete .btn-danger{width:100%;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:#FFF0F0;color:#E60012;transition:.15s}

/* Vehicle Add Modal */
#veh-modal .form-select, #veh-modal .form-input{width:100%;padding:10px 12px;border:1px solid #DDD;border-radius:8px;font-size:14px;background:#FAFAFA;color:#1A1A1A;outline:none}
#veh-modal .form-select:focus, #veh-modal .form-input:focus{border-color:#E60012;background:#fff}

/* Expense filter */
.expense-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.expense-filter-btn{padding:5px 14px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #DDD;background:#fff;color:#888;white-space:nowrap;transition:.15s}
.expense-filter-btn.active{background:#E60012;color:#fff;border-color:#E60012}
.expense-vehicle-switcher{display:flex;gap:6px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;margin-bottom:10px}
.expense-vehicle-switcher::-webkit-scrollbar{display:none}
.expense-date-range{display:flex;gap:6px;align-items:center}
.expense-date-input{flex:1;padding:6px 8px;border:1px solid #DDD;border-radius:8px;font-size:12px;background:#FAFAFA;color:#1A1A1A;outline:none}
.expense-date-input:focus{border-color:#E60012}

/* Mod Search Dropdown */

// ====== SYNC LOGIC ======
function getSyncTargets(vehicleId, exceptId){
  const pairs = {};
  mods.filter(m=>m.vehicleId===vehicleId && m.isConsumable && m.id!==exceptId).forEach(m=>{
    const key = m.majorCategory+'|||'+m.subCategory;
    if(!pairs[key] || m.date > pairs[key].date) pairs[key] = m;
  });
  return Object.values(pairs);
}

function handleConsumableSync(mid, oldSessionsUsed, newSessionsUsed, syncChecked, rememberChecked, onDone){
  const delta = newSessionsUsed - oldSessionsUsed;
  autoSyncConsumables = rememberChecked;
  if(!syncChecked){ onDone(); return; }
  const m = mods.find(x=>x.id===mid);
  if(!m || !m.isConsumable){ onDone(); return; }
  const targets = getSyncTargets(m.vehicleId, mid);
  if(!targets.length){ onDone(); return; }
  if(rememberChecked){
    targets.forEach(t=>{ t.sessionsUsed = Math.max(0, (t.sessionsUsed||0) + delta); });
    onDone();
  } else {
    showSyncConfirm(delta, targets.length, ()=>{
      targets.forEach(t=>{ t.sessionsUsed = Math.max(0, (t.sessionsUsed||0) + delta); });
      onDone();
    }, ()=>{ onDone(); });
  }
}

// ====== UTILS ======
function timeToMs(t){ const p=t.split(/[:.]/); return +p[0]*60000+ +p[1]*1000+ +p[2]; }
function msToTime(ms){ const m=Math.floor(ms/60000); const s=Math.floor((ms%60000)/1000); const ms3=ms%1000; return m+':'+String(s).padStart(2,'0')+'.'+String(ms3).padStart(3,'0'); }
function msToSecStr(ms){ const s=Math.floor(ms/1000); const ms3=ms%1000; return s+'.'+String(ms3).padStart(3,'0'); }
function diffStr(t1,t2){ if(!t1||!t2)return''; const d=timeToMs(t2)-timeToMs(t1); const abs=Math.abs(d); return msToSecStr(abs); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sorted(r){ return [...r].sort((a,b)=>b.date.localeCompare(a.date)||timeToMs(a.time)-timeToMs(b.time)); }
function getPB(track){ const r=records.filter(x=>x.track===track); if(!r.length)return null; return r.reduce((a,b)=>timeToMs(a.time)<timeToMs(b.time)?a:b); }
function getTarget(t){ return TARGETS[t]||''; }

// ====== COMPUTE PB CARDS ======
function computeCards(){
  const trackCount={}; const last5=[];
  const s=sorted(records);
  s.forEach((r,i)=>{ trackCount[r.track]=(trackCount[r.track]||0)+1; if(i<5)last5.push(r.track); });
  const recent5={}; last5.forEach(t=>recent5[t]=(recent5[t]||0)+1);
  const tracks=Object.keys(trackCount);
  let mostTrack=null,mostN=0;
  for(const t of tracks){ if(trackCount[t]>mostN){ mostN=trackCount[t]; mostTrack=t; } }
  let hotTrack=null,hotN=0;
  for(const t of tracks){ if(t!==mostTrack&&recent5[t]&&recent5[t]>=3&&recent5[t]>hotN){ hotN=recent5[t]; hotTrack=t; } }
  let firstTrack=null,firstDate='';
  const firstTimes={};
  tracks.forEach(t=>{ const fr=s.filter(x=>x.track===t).pop(); if(fr){ firstTimes[t]=fr.date; } });
  for(const t of tracks){
    if(t===mostTrack||t===hotTrack)continue;
    if(!firstDate||firstTimes[t]>firstDate){ firstDate=firstTimes[t]; firstTrack=t; }
    else if(!firstTrack){ firstTrack=t; firstDate=firstTimes[t]; }
  }
  const cards=[];
  if(mostTrack) cards.push({ type:'most', track:mostTrack, label:'🏆 征战最多', badge:'most', count:trackCount[mostTrack] });
  if(hotTrack)  cards.push({ type:'hot',  track:hotTrack,  label:'🔥 最近常去', badge:'hot',  count:'最近'+(recent5[hotTrack])+'次' });
  if(firstTrack)cards.push({ type:'new',  track:firstTrack,label:'🆕 首次征服', badge:'newb',count:'首次' });
  return cards;
}

function getLatestMod(vid, major, sub){
  return mods.filter(m=>m.vehicleId===vid && m.majorCategory===major && m.subCategory===sub)

}

}

function renderHomeStatus(vid){
  const slots = homeStatusSlots[vid] || [null,null,null,null];
  const rendered = new Set();
  const items = [];
  slots.forEach(key=>{
    if(!key){ items.push(null); return; }
    if(rendered.has(key)){ items.push(null); return; }
    const [major, sub] = key.split('|||');
    const mod = getLatestMod(vid, major, sub);
    if(!mod){ items.push(null); return; }
    if(major==='轮胎'){
      const otherSub = sub==='前轮'?'后轮':'前轮';
      const otherKey = '轮胎|||'+otherSub;
      const otherMod = getLatestMod(vid, '轮胎', otherSub);
      items.push({ type:'tire', front:sub==='前轮'?mod:otherMod, rear:sub==='后轮'?mod:otherMod });
      rendered.add(key);
      rendered.add(otherKey);
    } else {
      items.push({ type:'single', mod });
      rendered.add(key);
    }
  });

  let html = '';
  for(let i=0;i<4;i++){
    const item = items[i];
    if(!item) continue;
    if(item.type==='tire'){
      html+=renderHomeTirePair(item.front, item.rear);
    } else {
      html+=renderHomeConsumable(item.mod);
    }
  }

  const cards = document.getElementById('home-status-cards');
  cards.innerHTML = html || '<div style="text-align:center;padding:20px;color:#CCC;font-size:13px">点击编辑添加状态</div>';

  // Attach click handlers for session editing
  cards.querySelectorAll('.mod-usage-clickable').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    openSessionModal(+el.dataset.mid);
  }));
}

    if(!m) return '<div class="home-status-pair-col"><div style="color:#CCC;font-size:11px;text-align:center;padding:8px">无'+label+'记录</div></div>';
    const u = m.sessionsUsed||0;
    const t = m.targetSessions||0;
    const pct = t>0?Math.min(100,Math.round(u/t*100)):0;
    const level = t>0?(pct>=100?'high':pct>=80?'mid':'low'):'';
    return '<div class="home-status-pair-col">'
      +'<div style="font-size:11px;color:#888;font-weight:600;margin-bottom:3px">'+label+'</div>'
      +'<div style="font-size:10px;color:#BBB;margin-bottom:4px">'+(m.product||'--')+(m.spec?' '+m.spec:'')+'</div>'

// ====== STATUS EDIT MODAL ======
function openStatusEditModal(){
  const vid = getHomeVehicleId();
  if(!vid) return;
  if(!homeStatusSlots[vid]) homeStatusSlots[vid] = [null,null,null,null];
  const slots = homeStatusSlots[vid];
  const selectedKeys = slots.filter(s=>s);

  // Available: unique (major, sub) pairs for this vehicle's consumables
  const allPairs = [];
  const seen = {};
  mods.filter(m=>m.vehicleId===vid&&m.isConsumable).forEach(m=>{
    const k = m.majorCategory+'|||'+m.subCategory;
    if(!seen[k]){ seen[k]=true; allPairs.push(k); }
  });
  const availableKeys = allPairs.filter(k=>!selectedKeys.includes(k));

  // Selected
  const selEl = document.getElementById('status-edit-selected');
  if(selectedKeys.length){
    selEl.innerHTML = selectedKeys.map(key=>'<div class="status-edit-item" data-key="'+key+'">'
      +'<span class="drag-handle">≡</span>'
      +'<div class="item-info"><div class="item-name">'+formatStatusKey(key)+'</div><div class="item-meta">'+getStatusModInfo(vid,key)+'</div></div>'
      +'<button class="item-btn remove">−</button>'
      +'</div>').join('');
  } else {
    selEl.innerHTML = '<div style="font-size:12px;color:#CCC;padding:8px">暂未选择，从下方添加</div>';
  }

  // Available
  const availEl = document.getElementById('status-edit-available');
  const isFull = selectedKeys.length >= 4;
  if(availableKeys.length){
    availEl.innerHTML = availableKeys.map(key=>'<div class="status-edit-item" data-key="'+key+'">'
      +'<div class="item-info"><div class="item-name">'+formatStatusKey(key)+'</div><div class="item-meta">'+getStatusModInfo(vid,key)+'</div></div>'
      +'<button class="item-btn add"'+(isFull?' disabled':'')+'>+</button>'
      +'</div>').join('');
  } else {
    availEl.innerHTML = '<div style="font-size:12px;color:#CCC;padding:8px">'+(!allPairs.length?'暂无消耗品记录':'所有消耗品已添加')+'</div>';
  }

  // Remove buttons
  selEl.querySelectorAll('.item-btn.remove').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.parentElement.dataset.key;
      const s = [...slots];
      s[s.indexOf(key)] = null;
      homeStatusSlots[vid] = s.filter(Boolean);
      while(homeStatusSlots[vid].length < 4) homeStatusSlots[vid].push(null);
      openStatusEditModal();
    });
  });

  // Add buttons
  availEl.querySelectorAll('.item-btn.add').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.parentElement.dataset.key;
      const s = [...slots];
      const emptyIdx = s.indexOf(null);
      if(emptyIdx >= 0) s[emptyIdx] = key;
      homeStatusSlots[vid] = s;
      openStatusEditModal();
    });
  });

  // Drag sort
  setupDragSort(selEl, (orderedKeys)=>{
    const s = [null,null,null,null];
    orderedKeys.forEach((k,i)=>{ if(i<4) s[i] = k; });
    homeStatusSlots[vid] = s;
  });

  document.getElementById('status-edit-modal').classList.add('show');
}

function closeStatusEditModal(){
  document.getElementById('status-edit-modal').classList.remove('show');
}

function formatStatusKey(key){
  const [major, sub] = key.split('|||');
  return sub+' · '+major;
}

function getStatusModInfo(vid, key){
  const [major, sub] = key.split('|||');
  const m = getLatestMod(vid, major, sub);
  return m?(m.product||'--')+(m.spec?' '+m.spec:'')+(m.position?' · '+m.position:''):'';
}

function setupDragSort(listEl, onReorder){
  let dragIdx = -1;

  function reorder(clientY){
    if(dragIdx<0) return;
    const items = [...listEl.children];
    const dragItem = items[dragIdx];
    if(!dragItem) return;
    items.forEach((item,i)=>{
      if(i===dragIdx) return;
      const rect = item.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      if(clientY > mid && dragIdx < i){ listEl.insertBefore(dragItem, item.nextSibling); dragIdx = i; }
      else if(clientY < mid && dragIdx > i){ listEl.insertBefore(dragItem, item); dragIdx = i; }
    });
  }

  function cleanup(){
    if(dragIdx>=0){
      listEl.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
      const ordered = [...listEl.children].map(el=>el.dataset.key).filter(Boolean);
      if(onReorder) onReorder(ordered);
    }
    dragIdx = -1;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  }

  // Touch
  listEl.addEventListener('touchstart', e=>{
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const item = handle.closest('.status-edit-item');
    if(!item) return;
    dragIdx = [...listEl.children].indexOf(item);
    item.classList.add('dragging');
    e.preventDefault();
  }, {passive:false});
  listEl.addEventListener('touchmove', e=>{ reorder(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
  listEl.addEventListener('touchend', e=>{ cleanup(); e.preventDefault(); });

  // Mouse
  const onMouseMove = e=>{ reorder(e.clientY); e.preventDefault(); };
  const onMouseUp = e=>{ cleanup(); e.preventDefault(); };
  listEl.addEventListener('mousedown', e=>{
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const item = handle.closest('.status-edit-item');
    if(!item) return;
    dragIdx = [...listEl.children].indexOf(item);
    item.classList.add('dragging');
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
    e.preventDefault();
  });
}

  if(!track||!min||sec===''||ms===''){ alert('请填写赛道和圈速'); return; }

  if(secNum>59||msNum>999){ alert('秒数不能超过59，毫秒不能超过999'); return; }

  const time=min+':'+String(secNum).padStart(2,'0')+'.'+String(msNum).padEnd(3,'0');

  // Target
  if(tMin!==''&&tSec!==''&&tMs!==''){
    TARGETS[track]=tMin+':'+String(+tSec).padStart(2,'0')+'.'+String(+tMs).padEnd(3,'0');
  }

  const temp=tempMin||tempMax?(tempMin||'?')+'~'+(tempMax||'?'):'';

});

    if(!modEditingId){
      const vehicleId = +document.getElementById('m-vehicle').value;
      const prev = mods.filter(m=>m.vehicleId===vehicleId && m.majorCategory===major && m.subCategory===sub)
        .sort((a,b)=>b.date.localeCompare(a.date))[0];
      if(prev){
        document.getElementById('m-product-other').value = prev.product || '';
        document.getElementById('m-spec').value = prev.spec || '';
        document.getElementById('m-target-sessions').value = prev.targetSessions||'';
      }
    }
    return;
  }
  prodSel.style.display = '';
  prodSel.innerHTML = parts.map(p => '<option value="'+p+'">'+p+'</option>').join('');
  document.getElementById('m-product-other').style.display = 'none';
  document.getElementById('m-engine-group').style.display = 'none';
  // Auto backfill for new mode
  if(!modEditingId){
    const vehicleId = +document.getElementById('m-vehicle').value;
    const prev = mods.filter(m=>m.vehicleId===vehicleId && m.majorCategory===major && m.subCategory===sub)
      .sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(prev){
      if(prev.product && [...prodSel.options].some(o=>o.value===prev.product)){
        prodSel.value = prev.product;
      } else {
        document.getElementById('m-product-other').style.display='block';
        document.getElementById('m-product-other').value = prev.product || '';
      }
      document.getElementById('m-spec').value = prev.spec || '';
      document.getElementById('m-target-sessions').value = prev.targetSessions||'';
      if(major==='动力与传动系统' && sub==='发动机' && prev.product==='强化'){
        document.getElementById('m-engine-group').style.display = 'block';
        document.getElementById('m-engine-work').value = prev.engineWork || '';
      }
    }
  }
}

// Search
function buildModSearchIndex(){
  const idx = [];
  for(const major of MAJOR_CATEGORIES){
    const subs = MOD_PARTS_DB[major];
    if(!subs) continue;
    for(const sub of Object.keys(subs)){
      idx.push({ major, sub, label: major+' > '+sub, type:'category' });
      for(const part of subs[sub]){
        if(part && part !== '其他') idx.push({ major, sub, part, label: part+' ('+major+' > '+sub+')', type:'product' });
      }
    }
  }
  return idx;
}

document.getElementById('m-search').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  const dd = document.getElementById('m-search-dd');
  if(!q){ dd.style.display='none'; return; }
  const idx = buildModSearchIndex();
  const matches = idx.filter(item => item.label.toLowerCase().includes(q)).slice(0, 8);
  if(!matches.length){ dd.style.display='none'; return; }
  dd.innerHTML = matches.map(item =>
    '<div class="mod-search-dd-item" data-major="'+item.major+'" data-sub="'+item.sub+'" data-part="'+(item.part||'')+'">'
    +'<div class="dd-main">'+(item.part||(item.major+' > '+item.sub))+'</div>'
    +'<div class="dd-path">'+item.major+' > '+item.sub+'</div>'
    +'</div>'
  ).join('');
  dd.style.display='block';
});
document.getElementById('m-search-dd').addEventListener('click', function(e){
  const item = e.target.closest('.mod-search-dd-item');
  if(!item) return;
  const major = item.dataset.major;
  const sub = item.dataset.sub;
  const part = item.dataset.part;
  document.getElementById('m-search').value = '';
  this.style.display = 'none';
  // Set major
  populateMajorSelect(major);
  document.getElementById('m-major').value = major;
  onMajorChange();
  // Set sub
  document.getElementById('m-sub').value = sub;
  onSubChange();
  // Set product if applicable
  if(part){
    setTimeout(()=>{ document.getElementById('m-product').value = part; onProductChange(); }, 50);
  }
});

document.getElementById('mod-submit').addEventListener('click', ()=>{
  const vehicleId = +document.getElementById('m-vehicle').value;
  const majorCategory = document.getElementById('m-major').value;
  const subCategory = document.getElementById('m-sub').value;
  let product = document.getElementById('m-product').value;
  if(product === '其他' || !product) product = document.getElementById('m-product-other').value.trim();
  const spec = document.getElementById('m-spec').value.trim();
  const engineWork = document.getElementById('m-engine-group').style.display!=='none' ? document.getElementById('m-engine-work').value.trim() : '';
  const position = document.getElementById('m-pos-group').style.display !== 'none' ? document.getElementById('m-position').value : '';
  const isConsumable = document.getElementById('m-consumable').checked;
  const installDate = document.getElementById('m-install-date').value;
  const sessionsUsed = +(document.getElementById('m-sessions').value)||0;
  const targetSessions = +(document.getElementById('m-target-sessions').value)||0;
  const price = +document.getElementById('m-price').value||0;
  const date = document.getElementById('m-date').value || today();

  if(!vehicleId || !majorCategory){ alert('请选择车辆和大类'); return; }

  const record = { vehicleId, majorCategory, subCategory:'', product:'', spec:'', engineWork:'', position:'', isConsumable:false, installDate:'', sessionsUsed:0, targetSessions:0, price:0, date };
  if(subCategory) record.subCategory = subCategory;
  if(product) record.product = product;
  if(spec) record.spec = spec;
  if(engineWork) record.engineWork = engineWork;
  if(position) record.position = position;
  record.isConsumable = isConsumable;
  if(installDate) record.installDate = installDate;
  record.sessionsUsed = sessionsUsed;
  record.targetSessions = targetSessions;
  if(price) record.price = price;
  if(date) record.date = date;

  if(modEditingId){
    const oldSessionsUsed = mods.find(x=>x.id===modEditingId)?.sessionsUsed||0;
    const idx = mods.findIndex(x => x.id === modEditingId);
    if(idx !== -1){ mods[idx] = { ...mods[idx], ...record }; }
    if(record.isConsumable){
      const syncChecked = document.getElementById('m-sync').checked;
      const rememberChecked = document.getElementById('m-remember').checked;
      handleConsumableSync(modEditingId, oldSessionsUsed, sessionsUsed, syncChecked, rememberChecked, ()=>{
        closeModModal();
        renderMyVehicles();
        renderExpenses();
        renderHome();
      });
    } else {
      closeModModal();
      renderMyVehicles();
      renderExpenses();
      renderHome();
    }
  } else {
    mods.push({ id: ++nextModId, ...record });
    closeModModal();
    renderMyVehicles();
    renderExpenses();
  }
});

document.getElementById('mod-delete-btn').addEventListener('click', ()=>{

// ====== MY VEHICLES PAGE ======
let mvSelectedIdx=0;
function renderMyVehicles(){
  if(!vehicles.length){
    document.getElementById('mv-switcher').innerHTML = '';
    document.getElementById('mv-vehicle-card').innerHTML = '<div style="width:100%;text-align:center;padding:30px;color:#CCC;font-size:14px">暂无车辆，点击 + 添加</div>';
    document.getElementById('mv-mod-tags').innerHTML = '';
    document.getElementById('mv-mod-list').innerHTML = '<div style="text-align:center;padding:30px;color:#CCC;font-size:13px">暂无车辆</div>';
    return;
  }
  if(mvSelectedIdx>=vehicles.length)mvSelectedIdx=0;
  const v=vehicles[mvSelectedIdx];

  // Vehicle switcher
  const switcher=document.getElementById('mv-switcher');
  switcher.innerHTML=vehicles.map((vv,i)=>'<span class="mv-switch-tag'+(i===mvSelectedIdx?' active':'')+'" data-idx="'+i+'">'+vv.name+'</span>').join('');
  switcher.querySelectorAll('.mv-switch-tag').forEach(el=>el.addEventListener('click',()=>{
    mvSelectedIdx=+el.dataset.idx;
    renderMyVehicles();
  }));

  // Vehicle card
  const card=document.getElementById('mv-vehicle-card');
  const photoHtml=v.photo?'<img src="'+v.photo+'" alt="'+v.name+'" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div style=font-size:32px>🏍️</div>\'">':'<div style="font-size:32px">🏍️</div>';
  const isDefault = v.id === homeVehicleId || (!homeVehicleId && mvSelectedIdx === 0);
  card.innerHTML='<div class="mv-vehicle-photo">'+photoHtml+'</div>'
    +'<div class="mv-vehicle-info">'
    +'<div class="mv-vehicle-name">'+v.name+(isDefault?'<span style="font-size:10px;background:#E60012;color:#fff;padding:1px 6px;border-radius:6px;margin-left:6px;font-weight:600;vertical-align:middle">默认</span>':'')+'</div>'
    +'<div class="mv-vehicle-detail">'+(v.brand||'品牌')+' · '+(v.model||'车型')+' · <span>'+(v.year||'--')+'</span></div>'
    +'<div class="mv-vehicle-actions">'
    +'<button class="mv-vehicle-btn default" data-action="edit-vehicle">编辑</button>'
    +(!isDefault?'<button class="mv-vehicle-btn default" data-action="set-default">设为默认</button>':'')
    +'<button class="mv-vehicle-btn danger" data-action="delete-vehicle">删除车辆</button>'
      +'</div>'
      +'</div>';

  card.querySelector('[data-action="set-default"]')?.addEventListener('click', ()=>{
    const [veh] = vehicles.splice(mvSelectedIdx, 1);
    vehicles.unshift(veh);
    homeVehicleId = veh.id;
    mvSelectedIdx = 0;
    renderHome();
    renderRecent();
    renderMyVehicles();
  });
  card.querySelector('[data-action="edit-vehicle"]')?.addEventListener('click', ()=>{
    openVehicleAddModal(v.id);
  });
  card.querySelector('[data-action="delete-vehicle"]')?.addEventListener('click', ()=>{
    const modCount = mods.filter(m => m.vehicleId === v.id).length;
    if(!confirm(`确定删除 "${v.name}"？`+(modCount?`该车的 ${modCount} 条改装记录将被同步删除。`:''))) return;
    mods = mods.filter(m => m.vehicleId !== v.id);
    vehicles.splice(mvSelectedIdx, 1);
    if(vehicles.length && mvSelectedIdx >= vehicles.length) mvSelectedIdx = vehicles.length - 1;
    renderHome();
    renderRecent();
    renderMyVehicles();
    renderExpenses();
  });

  // Mods filter tags
  const FILTER_CATS = ['全部','🔥 消耗品','刹车系统','避震','动力与传动系统','轮胎','外观及骑行三角','其他'];
  const filterTag=document.getElementById('mv-mod-tags');
  const activeFilter=filterTag.dataset.filter||'全部';
  filterTag.innerHTML=FILTER_CATS.map(c=>{
    let cls = 'mv-mod-tag';
    if(c==='全部' && c===activeFilter) cls+=' active';
    else if(c===activeFilter) cls+=' active';
    if(c==='🔥 消耗品') cls+=' consumable';
    return '<span class="'+cls+'" data-cat="'+c+'">'+c+'</span>';
  }).join('');
  filterTag.querySelectorAll('.mv-mod-tag').forEach(el=>el.addEventListener('click',()=>{
    filterTag.dataset.filter=el.dataset.cat;
    renderMyVehicles();
  }));

  // Mods list
  const list=document.getElementById('mv-mod-list');
  list.innerHTML='';
  let filtered=mods.filter(m=>m.vehicleId===v.id);
  if(activeFilter==='🔥 消耗品'){
    filtered=filtered.filter(m=>m.isConsumable);
  } else if(activeFilter!=='全部'){
    filtered=filtered.filter(m=>m.majorCategory===activeFilter);
  }
  filtered.sort((a,b)=>b.date.localeCompare(a.date));
  if(!filtered.length){ list.innerHTML='<div style="text-align:center;padding:30px;color:#CCC;font-size:13px">暂无改装明细</div>'; return; }

  // Group by (majorCategory, subCategory)
  const groups = {};
  filtered.forEach(m=>{
    const key = m.majorCategory+'|||'+m.subCategory;
    if(!groups[key]) groups[key] = [];
    groups[key].push(m);
  });

  Object.entries(groups).forEach(([key, items])=>{
    items.sort((a,b)=>b.date.localeCompare(a.date));
    const latest = items[0];
    const major = latest.majorCategory;
    const sub = latest.subCategory;
    const majorIcons={'刹车系统':'🛑','避震':'🔧','动力与传动系统':'⚡','轮胎':'🛞','外观及骑行三角':'🎨','其他':'📦'};

    list.innerHTML+='<div class="mv-mod-item" data-group="'+key+'">'
      +'<div class="mv-mod-left">'
      +'<div class="mv-mod-icon">'+(majorIcons[major]||'📦')+'</div>'
      +'<div>'
      +'<div class="mv-mod-name">'+sub+(latest.isConsumable?'<span class="mod-consumable-badge">消耗</span>':'')+'</div>'
      +'<div class="mv-mod-date">'+(latest.product||'未指定品牌')+(latest.spec?' '+latest.spec:'')+' · '+latest.date+'</div>'
      +'</div>'
      +'</div>'
      +'<div class="mv-mod-right"><span class="mv-mod-cat">'+major+'</span>'
      +'<div class="mv-mod-actions">'
      +(items.length>1?'<button class="mod-expand-btn" data-group="'+key+'"><span class="count">'+items.length+'条</span></button>':'')
      +'<button class="mv-mod-btn edit" data-mid="'+latest.id+'">✎</button>'
      +'</div>'
      +'</div>'
      +'</div>';

    // Usage bar for consumable
    if(latest.isConsumable){
      const u = latest.sessionsUsed||0;
      const t = latest.targetSessions||0;
      const pct = t>0 ? Math.min(100, Math.round(u/t*100)) : 0;
      const level = t>0 ? (pct<50?'low':pct<80?'mid':'high') : '';
      list.innerHTML+='<div class="mod-usage" data-mid="'+latest.id+'">'
        +(t>0?'<div class="mod-usage-bar"><div class="mod-usage-fill '+level+'" style="width:'+pct+'%"></div></div>'+pct+'% | ':'')
        +'<span class="mod-usage-clickable" data-field="sessionsUsed">已用 '+u+'节</span>'
        +(t>0?' / <span class="mod-usage-clickable" data-field="targetSessions">目标 '+t+'节</span>':' · <span class="mod-usage-clickable" data-field="targetSessions">目标未设</span>')
        +'</div>';
    }

    // History rows
    if(items.length>1){
      items.forEach((m,i)=>{
        const cls = i===0 ? 'mod-history-item latest' : 'mod-history-item';
        list.innerHTML+='<div class="'+cls+'" data-group="'+key+'" style="display:none">'
          +'<div class="mod-history-left"><div style="font-weight:600">'+(m.product||'--')+(m.spec?' '+m.spec:'')+'</div><div style="font-size:10px;color:#999">'+m.date+'</div></div>'
          +'<div class="mod-history-right">'
          +(m.isConsumable?'<span class="mod-consumable-badge" style="font-size:9px">消耗</span>':'')
          +(m.isConsumable?'<span style="font-size:10px;color:#888;margin-right:4px">'+m.sessionsUsed+'/'+(m.targetSessions||'?')+'节</span>':'')
          +'<span style="font-size:11px;color:#888;margin-right:4px">¥'+m.price.toLocaleString()+'</span>'
          +'<button class="mv-mod-btn edit" data-mid="'+m.id+'" style="font-size:11px">✎</button>'
          +'</div>'
          +'</div>';
      });
    }
  });

  // Expand toggle
  list.querySelectorAll('.mod-expand-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const key = btn.dataset.group;
      const rows = list.querySelectorAll('[data-group="'+key+'"].mod-history-item');
      const visible = rows[0]?.style.display !== 'none';
      rows.forEach(r=>r.style.display=visible?'none':'');
      btn.querySelector('.count').textContent = visible ? itemsByKey(key)+'条' : '▲';
    });
  });
  function itemsByKey(key){
    const [maj,sub] = key.split('|||');
    return mods.filter(m=>m.vehicleId===v.id && m.majorCategory===maj && m.subCategory===sub).length;
  }

  // Edit buttons
  list.querySelectorAll('.mv-mod-btn.edit').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    openModModal(+b.dataset.mid);
  }));
  // Session clickable
  list.querySelectorAll('.mod-usage-clickable').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const mid = +el.parentElement.dataset.mid;
    openSessionModal(mid);
  }));
}

// ====== SESSION EDIT MODAL ======
let sessionEditingMid = null;
const sessionModal = document.getElementById('session-modal');

function openSessionModal(mid){
  const m = mods.find(x => x.id === mid);
  if(!m) return;
  sessionEditingMid = mid;
  document.getElementById('s-used').value = m.sessionsUsed||0;
  document.getElementById('s-target').value = m.targetSessions||'';
  document.getElementById('s-sync').checked = true;
  document.getElementById('s-remember').checked = autoSyncConsumables;
  sessionModal.classList.add('show');
}
function closeSessionModal(){ sessionModal.classList.remove('show'); sessionEditingMid = null; }

document.getElementById('session-cancel').addEventListener('click', closeSessionModal);
sessionModal.addEventListener('click', e => { if(e.target === sessionModal) closeSessionModal(); });

document.getElementById('session-submit').addEventListener('click', ()=>{
  const m = mods.find(x => x.id === sessionEditingMid);
  if(!m) return;
  const oldUsed = m.sessionsUsed || 0;
  const newUsed = +document.getElementById('s-used').value||0;
  const newTarget = +document.getElementById('s-target').value||0;
  m.sessionsUsed = newUsed;
  m.targetSessions = newTarget;
  const syncChecked = document.getElementById('s-sync').checked;
  const rememberChecked = document.getElementById('s-remember').checked;
  handleConsumableSync(sessionEditingMid, oldUsed, newUsed, syncChecked, rememberChecked, ()=>{
    closeSessionModal();
    renderMyVehicles();
    renderHome();
  });
});

// ====== LEADERBOARD ======
const LB_RIDERS = [
  { name:'🏁 钢铁侠', avatar:'⚡', vehicle:'Yamaha R6' },
  { name:'🏁 闪电侠', avatar:'🔥', vehicle:'Kawasaki ZX-6R' },
  { name:'🏁 追风者', avatar:'🌪', vehicle:'Honda CBR600RR' },
  { name:'🏁 极速狂', avatar:'👑', vehicle:'Suzuki GSX-R600' },
  { name:'🏁 弯道王', avatar:'💫', vehicle:'Yamaha R6' },
  { name:'🏁 无影手', avatar:'💥', vehicle:'Kawasaki ZX-6R' },
  { name:'🏁 漂移帝', avatar:'🌀', vehicle:'Honda CBR600RR' },
  { name:'🏁 赛车魂', avatar:'🏎', vehicle:'Yamaha R6' },
];
function renderLeaderboard(){
  const trackSel=document.getElementById('lb-tracks');
  const trackNames=['ZIC','宁波','天马','天府'];
  const lbTrack=trackSel.dataset.selected||'ZIC';
  trackSel.innerHTML=trackNames.map(t=>'<button class="lb-track-btn'+(t===lbTrack?' active':'')+'" data-track="'+t+'">'+t+'</button>').join('');
  trackSel.querySelectorAll('.lb-track-btn').forEach(b=>b.addEventListener('click',()=>{
    trackSel.dataset.selected=b.dataset.track;
    renderLeaderboard();
  }));

  const list=document.getElementById('lb-list');
  list.innerHTML='';
  // Generate virtual leaderboard data
  const base=timeToMs('1:55.000');
  const data=LB_RIDERS.map((r,i)=>{
    const diff=i*350+Math.floor(Math.random()*200);
    const t=base+diff;
    return { ...r, time:msToTime(t), gap:i===0?'--':msToSecStr(diff) };
  });
  data.forEach((r,i)=>{
    const rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'other';
    list.innerHTML+='<div class="lb-card">'
      +'<div class="lb-rank '+rankClass+'">'+(i+1)+'</div>'
      +'<div class="lb-avatar">'+r.avatar+'</div>'
      +'<div class="lb-info"><div class="lb-name">'+r.name+'</div><div class="lb-vehicle">'+r.vehicle+'</div></div>'
      +'<div class="lb-right"><div class="lb-time">'+r.time+'</div><div class="lb-gap">'+(i===0?'PB':'+'+r.gap+'s')+'</div></div>'
      +'</div>';
  });
}

function renderExpenses(){
  // Vehicle switcher
  const vsEl = document.getElementById('expense-vehicle-switcher');
  const activeVehId = vsEl.dataset.vehid || 'all';
  vsEl.innerHTML = '<span class="mv-switch-tag'+(activeVehId==='all'?' active':'')+'" data-vid="all">全部</span>'+
    vehicles.map(v=>'<span class="mv-switch-tag'+(''+v.id===activeVehId?' active':'')+'" data-vid="'+v.id+'">'+v.name+'</span>').join('');
  vsEl.querySelectorAll('.mv-switch-tag').forEach(el=>el.addEventListener('click',()=>{
    vsEl.dataset.vehid = el.dataset.vid;
    renderExpenses();
  }));

  // Time filter
  const filterEl = document.getElementById('expense-filter');
  const activeMode = filterEl.dataset.mode || 'year';
  const modes = ['year','month','custom'];
  const modeLabels = { year:'今年', month:'本月', custom:'自定义' };
  filterEl.innerHTML = modes.map(m=>
    '<button class="expense-filter-btn'+(m===activeMode?' active':'')+'" data-mode="'+m+'">'+modeLabels[m]+'</button>'
  ).join('');
  filterEl.querySelectorAll('.expense-filter-btn').forEach(b=>b.addEventListener('click',()=>{
    filterEl.dataset.mode = b.dataset.mode;
    renderExpenses();
  }));

  // Custom date range
  const dateRangeEl = document.getElementById('expense-date-range');
  if(activeMode==='custom'){
    dateRangeEl.style.display = 'flex';
    document.getElementById('expense-date-from').value = filterEl.dataset.from || '';
    document.getElementById('expense-date-to').value = filterEl.dataset.to || '';
  } else {
    dateRangeEl.style.display = 'none';
  }

  // Apply filters
  let filtered = [...mods];
  if(activeVehId !== 'all'){
    filtered = filtered.filter(m=>m.vehicleId===+activeVehId);
  }
  const now = new Date();
  if(activeMode==='year'){
    const y = ''+now.getFullYear();
    filtered = filtered.filter(m=>m.date.startsWith(y));
  } else if(activeMode==='month'){
    const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    filtered = filtered.filter(m=>m.date.startsWith(ym));
  } else if(activeMode==='custom'){
    const from = filterEl.dataset.from || '';
    const to = filterEl.dataset.to || '';
    if(from) filtered = filtered.filter(m=>m.date >= from);
    if(to) filtered = filtered.filter(m=>m.date <= to);
  }
  filtered.sort((a,b)=>b.date.localeCompare(a.date));

  // Summary
  const total = filtered.reduce((s,m)=>s+m.price,0);
  const count = filtered.length;
  const uniqueMonths = [...new Set(filtered.map(m=>m.date.substring(0,7)))];
  const avg = uniqueMonths.length ? Math.round(total/uniqueMonths.length) : 0;

  document.getElementById('expense-summary').innerHTML =
    '<div class="expense-stat"><div class="num">¥'+total.toLocaleString()+'</div><div class="label">总花销</div></div>'+
    '<div class="expense-stat"><div class="num">¥'+avg.toLocaleString()+'</div><div class="label">月均</div></div>'+
    '<div class="expense-stat"><div class="num">'+count+'</div><div class="label">笔数</div></div>';

  // Category breakdown
  const catTotal = {};
  filtered.forEach(m=>{ catTotal[m.majorCategory] = (catTotal[m.majorCategory]||0)+m.price; });
  const catOrder = ['刹车系统','避震','动力与传动系统','轮胎','外观及骑行三角','其他'];
  const catColors = { '刹车系统':'#E60012','避震':'#1A1A1A','动力与传动系统':'#FF6B00','轮胎':'#4A90D9','外观及骑行三角':'#888','其他':'#AAA' };
  const catIcon2 = { '刹车系统':'🛑','避震':'🔧','动力与传动系统':'⚡','轮胎':'🛞','外观及骑行三角':'🎨','其他':'📦' };

  // Pie
  let pieParts = '';
  let cum = 0;
  const entries = catOrder.filter(c=>catTotal[c]).map(c=>{
    const pct = total ? catTotal[c]/total : 0;
    const start = cum; cum += pct;
    return { cat:c, start, end:cum, color:catColors[c] };
  });
  if(entries.length){
    pieParts = entries.map(e=>e.color+' '+Math.round(e.start*360)+'deg '+Math.round(e.end*360)+'deg').join(', ');
  } else {
    pieParts = '#EEE 0% 100%';
  }
  document.getElementById('expense-pie').style.background = 'conic-gradient('+pieParts+')';

  // Legend
  document.getElementById('expense-legend').innerHTML = entries.length ?
    entries.map(e=>'<div style="font-size:12px;margin-bottom:6px"><span style="color:'+e.color+'">●</span> '+e.cat+' <strong>'+Math.round((e.end-e.start)*100)+'%</strong></div>').join('') :
    '<div style="font-size:12px;color:#CCC">暂无改装花销</div>';

  // List
  const listEl = document.getElementById('expense-list');
  if(!filtered.length){
    listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#CCC;font-size:13px">暂无记录</div>';
  } else {
    listEl.innerHTML = filtered.map(m=>
      '<div class="expense-item">'+
      '<div class="expense-left">'+
      '<div class="expense-icon">'+(catIcon2[m.majorCategory]||'📦')+'</div>'+
      '<div><div class="expense-name">'+m.subCategory+(m.product?' · '+m.product+(m.spec?' '+m.spec:''):'')+'</div><div class="expense-date">'+m.date+'</div></div>'+
      '</div>'+
      '<div class="expense-amount">¥'+m.price.toLocaleString()+'</div>'+
      '</div>'
    ).join('');
  }
}

// ====== INIT ======
renderHome();
render();
renderRecent();
renderMyVehicles();
renderLeaderboard();
renderExpenses();

// Custom date range apply
document.getElementById('expense-date-apply').addEventListener('click', ()=>{
  const filterEl = document.getElementById('expense-filter');
  const from = document.getElementById('expense-date-from').value;
  const to = document.getElementById('expense-date-to').value;
  if(from && to && from > to){ alert('起始日期不能晚于结束日期'); return; }
  filterEl.dataset.from = from;
  filterEl.dataset.to = to;
  renderExpenses();
});

const tabs = document.querySelectorAll('.tab');
const fab = document.getElementById('fab');
const fabMenu = document.getElementById('fab-menu');
const fabOverlay = document.getElementById('fab-overlay');
let fabMenuOpen = false;

function showFabMenu(){
  fabMenu.classList.add('show');
  fabOverlay.classList.add('show');
  fab.textContent = '✕';
  fab.style.transform = 'rotate(45deg)';
  fabMenuOpen = true;
}
function hideFabMenu(){
  fabMenu.classList.remove('show');
  fabOverlay.classList.remove('show');
  fab.textContent = '+';
  fab.style.transform = '';
  fabMenuOpen = false;
}

fabOverlay.addEventListener('click', hideFabMenu);
document.getElementById('fab-add-vehicle').addEventListener('click', ()=>{
  hideFabMenu();
  openVehicleAddModal();
});
document.getElementById('fab-add-mod').addEventListener('click', ()=>{
  hideFabMenu();
  openModModal(null);
});

fab.style.display = 'none';
const fabPages = ['laps', 'mods'];

fab.addEventListener('click', ()=>{
  const activeTab = document.querySelector('.tab.active');
  if(activeTab && activeTab.dataset.page === 'mods'){
    fabMenuOpen ? hideFabMenu() : showFabMenu();
  } else if(activeTab && activeTab.dataset.page === 'expenses'){
    openModModal(null);
  } else {
    openModal(null);
  }
});

const pages = {
  home: document.getElementById('page-home'),
  laps: document.getElementById('page-laps'),
  mods: document.getElementById('page-mods'),
  expenses: document.getElementById('page-expenses'),
  leaderboard: document.getElementById('page-leaderboard'),
};

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    if(fabMenuOpen)hideFabMenu();
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[tab.dataset.page].classList.add('active');
    document.getElementById('content').scrollTop = 0;
    fab.style.display = fabPages.includes(tab.dataset.page) ? 'flex' : 'none';
    if(tab.dataset.page==='laps')render();
    if(tab.dataset.page==='home'){ renderHome(); renderRecent(); }
    if(tab.dataset.page==='leaderboard')renderLeaderboard();
    if(tab.dataset.page==='mods')renderMyVehicles();
    if(tab.dataset.page==='expenses')renderExpenses();
  });
});
</script>
