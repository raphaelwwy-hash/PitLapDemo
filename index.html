<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PitLap - 璧涜溅鍦堥€熷姪鎵?/title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F5F5;color:#1A1A1A;max-width:420px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{display:none}

/* Header */
.header{background:#fff;padding:12px 16px;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#E60012,#FF3333,#E60012,#1A1A1A)}
.header::after{content:'';position:absolute;bottom:0;right:20px;width:80px;height:20px;opacity:.06;background:repeating-linear-gradient(45deg,#000 0,#000 2px,transparent 2px,transparent 4px)}
.header h1{font-size:20px;font-weight:800;color:#1A1A1A;letter-spacing:1px}
.header h1 span{color:#E60012}
.header-badge{font-size:11px;color:#999;background:#F0F0F0;padding:3px 8px;border-radius:10px;font-weight:600}

/* Checkered accent bar */
.checkered{height:4px;background:repeating-linear-gradient(90deg,#1A1A1A 0,#1A1A1A 6px,#fff 6px,#fff 12px);flex-shrink:0}

/* Content */
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:8px;display:flex;flex-direction:column;gap:14px}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #EEEEEE;position:relative}
.card-title{font-size:13px;color:#888;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}
.card-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-red{background:#E60012}
.dot-black{background:#1A1A1A}

/* Vehicle Card */
.vehicle-card{background:#fff;border-left:4px solid #E60012;position:relative;overflow:hidden}
.vehicle-card::after{content:'馃弫';position:absolute;right:12px;top:12px;font-size:24px;opacity:.3}
.vehicle-card .racing-line{position:absolute;bottom:0;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#E60012 0,#E60012 8px,transparent 8px,transparent 16px)}
.vehicle-name{font-size:22px;font-weight:800;color:#1A1A1A;margin-bottom:4px}
.vehicle-sub{font-size:12px;color:#888;margin-bottom:12px}
.vehicle-stats{display:flex;gap:16px}
.vehicle-stat{text-align:center;flex:1;background:#F8F8F8;border-radius:8px;padding:8px 6px}
.vehicle-stat .num{font-size:18px;font-weight:800;color:#E60012}
.vehicle-stat .label{font-size:11px;color:#888;margin-top:2px;font-weight:500}

/* Tire */
.tire-bar{height:6px;background:#E8E8E8;border-radius:3px;margin-top:8px;overflow:hidden}
.tire-fill{height:100%;border-radius:3px}
.tire-fill.good{background:linear-gradient(90deg,#E60012,#FF6B00)}
.tire-fill.warn{background:linear-gradient(90deg,#CC0000,#E60012)}
.tire-info{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:4px}

/* Lap */
.lap-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0}
.lap-item:last-child{border-bottom:none}
.lap-track{font-size:14px;font-weight:700;color:#1A1A1A}
.lap-track-sub{font-size:11px;color:#999;margin-top:2px}
.lap-time{font-size:18px;font-weight:800;color:#E60012;font-variant-numeric:tabular-nums}
.lap-time.best{color:#1A1A1A}
.lap-time.best::after{content:' PB';font-size:10px;color:#1A1A1A;font-weight:700;background:#F0F0F0;padding:1px 5px;border-radius:4px;margin-left:4px}

/* Chart */
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100px;padding-top:14px;border-bottom:2px solid #E5E5E5}
.chart-bar{flex:1;border-radius:4px 4px 0 0;min-height:8px;position:relative;background:linear-gradient(180deg,#E60012,#FF5555)}
.chart-bar.best{background:linear-gradient(180deg,#1A1A1A,#444)}
.chart-bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:8px;color:#888;white-space:nowrap;font-weight:600}
.chart-labels{display:flex;gap:4px;margin-top:6px}
.chart-labels span{flex:1;font-size:8px;color:#999;text-align:center;font-weight:500}

/* Tabs */
.tabs{display:flex;background:#fff;border-top:2px solid #E5E5E5;flex-shrink:0;padding:4px 0 env(safe-area-inset-bottom,6px) 0;position:relative}
.tabs::before{content:'';position:absolute;top:-2px;left:10%;right:10%;height:2px;background:repeating-linear-gradient(90deg,#E60012 0,#E60012 8px,transparent 8px,transparent 16px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;cursor:pointer;transition:.15s;border:none;background:none;color:#999}
.tab svg{width:22px;height:22px}
.tab span{font-size:10px;font-weight:600}
.tab.active{color:#E60012}
.tab.active svg{color:#E60012;fill:#E60012}

/* Mods */
.mod-tags{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mod-tag{padding:6px 14px;border-radius:16px;font-size:12px;background:#F0F0F0;color:#888;white-space:nowrap;cursor:pointer;transition:.15s;border:none;font-weight:600}
.mod-tag.active{background:#E60012;color:#fff}
.lap-tag{padding:6px 14px;border-radius:16px;font-size:12px;background:#F0F0F0;color:#888;white-space:nowrap;cursor:pointer;transition:.15s;border:none;font-weight:600}
.lap-tag.active{background:#E60012;color:#fff}
.mod-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0}
.mod-item:last-child{border-bottom:none}
.mod-name{font-size:14px;font-weight:700;color:#1A1A1A}
.mod-cat{font-size:10px;color:#E60012;background:#FFF0F0;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:3px;font-weight:600}
.mod-price{font-size:15px;font-weight:700;color:#E60012}
.mod-date{font-size:10px;color:#999;text-align:right}

/* Expenses */
.expense-summary{display:flex;gap:12px;margin-bottom:4px}
.expense-stat{flex:1;text-align:center;background:#F8F8F8;border-radius:10px;padding:12px;border:1px solid #EEEEEE}
.expense-stat .num{font-size:20px;font-weight:800;color:#E60012}
.expense-stat .label{font-size:11px;color:#888;margin-top:2px;font-weight:500}
.expense-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0}
.expense-item:last-child{border-bottom:none}
.expense-left{display:flex;align-items:center;gap:10px}
.expense-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#F8F8F8}
.expense-name{font-size:14px;font-weight:600}
.expense-date{font-size:11px;color:#999}
.expense-amount{font-size:15px;font-weight:700;color:#E60012}

/* Pie */
.pie-placeholder{width:100px;height:100px;border-radius:50%;margin:0 auto;background:conic-gradient(#E60012 0% 35%,#1A1A1A 35% 55%,#FF6B00 55% 70%,#CCC 70% 85%,#555 85% 100%);position:relative;flex-shrink:0}
.pie-placeholder::after{content:'';position:absolute;inset:20px;border-radius:50%;background:#fff}

/* My */
.profile-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#E60012,#1A1A1A);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.profile-name{font-size:18px;font-weight:800;color:#1A1A1A}
.profile-sub{font-size:12px;color:#888}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:#F8F8F8;border-radius:10px;padding:14px;text-align:center;border:1px solid #EEE}
.stat-box .num{font-size:20px;font-weight:800;color:#E60012}
.stat-box .num.blue{color:#1A1A1A}
.stat-box .label{font-size:11px;color:#888;margin-top:3px;font-weight:500}
.menu-item{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #F0F0F0;color:#555;font-size:14px;font-weight:500;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item .arrow{margin-left:auto;color:#ccc;font-weight:700}
.menu-item .badge{background:#E60012;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:auto}

/* FAB */
.fab{position:fixed;bottom:76px;right:calc(50% - 210px + 16px);width:48px;height:48px;border-radius:50%;background:#E60012;color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(230,0,18,.35);display:flex;align-items:center;justify-content:center;z-index:10;transition:.15s;font-weight:700}
.fab:active{transform:scale(.92)}
@media(max-width:420px){.fab{right:16px}}

/* Misc */
.divider{height:1px;background:#F0F0F0;margin:4px 0}
.section-title{font-size:13px;color:#888;margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.legend span{font-size:11px;color:#888;font-weight:500}
.legend span em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}

/* Racing stripe decoration */
.racing-stripe{height:3px;background:repeating-linear-gradient(90deg,#1A1A1A 0,#1A1A1A 6px,#fff 6px,#fff 12px);margin:8px 0 4px;border-radius:1px}

/* === PB Cards === */
.pb-card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #EEEEEE;position:relative;overflow:hidden}
.pb-card:not(:last-child){margin-bottom:10px}
.pb-card .pb-badge{font-size:11px;font-weight:700;display:inline-block;padding:2px 10px;border-radius:10px;margin-bottom:6px}
.pb-badge.most{background:#1A1A1A;color:#fff}
.pb-badge.hot{background:#E60012;color:#fff}
.pb-badge.newb{background:#FFF0F0;color:#E60012;border:1px solid #E60012}
.pb-card .pb-track{font-size:18px;font-weight:800;color:#1A1A1A}
.pb-card .pb-time{font-size:20px;font-weight:800;color:#E60012;margin:2px 0}
.pb-card .pb-target{display:flex;align-items:baseline;gap:6px;font-size:13px;color:#888}
.pb-card .pb-gap{font-size:24px;font-weight:800;margin-left:auto}
.pb-card .pb-gap.red{color:#E60012}
.pb-card .pb-gap.green{color:#00AA55}
.pb-gap-unit{font-size:13px;font-weight:600}

/* === Lap List === */
.lap-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0F0F0}
.lap-list-item:last-child{border-bottom:none}
.lli-left{display:flex;flex-direction:column;gap:2px}
.lli-date{font-size:11px;color:#999;font-weight:500}
.lli-track{font-size:14px;font-weight:700;color:#1A1A1A}
.lli-vehicle{font-size:11px;color:#999}
.lli-time{font-size:18px;font-weight:800;color:#E60012;margin-right:6px}
.lli-actions{display:flex;gap:6px;align-items:center}
.lli-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.1s;background:transparent;color:#999}
.lli-btn:hover{background:#F0F0F0}
.lli-btn.edit{color:#1A1A1A}
.lli-btn.del{color:#E60012}
.lap-list-main{display:flex;align-items:center;flex:1}
.lap-list-right{display:flex;align-items:center;gap:4px;flex-shrink:0}

/* === Leaderboard === */
.leaderboard-page{padding:20px;padding-bottom:80px}
.lb-header{text-align:center;margin-bottom:20px}
.lb-track-select{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.lb-track-btn{padding:6px 16px;border-radius:20px;border:1.5px solid #DDD;background:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:#666;transition:.15s}
.lb-track-btn.active{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.lb-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.lb-rank{width:28px;text-align:center;font-weight:800;font-size:16px;flex-shrink:0}
.lb-rank.gold{color:#FFD700}
.lb-rank.silver{color:#C0C0C0}
.lb-rank.bronze{color:#CD7F32}
.lb-rank.other{color:#999}
.lb-avatar{width:40px;height:40px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#1A1A1A;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:14px;font-weight:700;color:#1A1A1A}
.lb-vehicle{font-size:11px;color:#999;margin-top:1px}
.lb-right{text-align:right;flex-shrink:0}
.lb-time{font-size:18px;font-weight:800;color:#E60012}
.lb-gap{font-size:11px;color:#999;margin-top:1px}

/* === Vehicle Management === */
.vm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.vm-title{font-size:18px;font-weight:800;color:#1A1A1A}
.vm-add-btn{width:32px;height:32px;border-radius:8px;border:none;background:#E60012;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vm-list{display:flex;flex-direction:column;gap:8px}
.vm-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.vm-item-name{font-size:14px;font-weight:600;color:#1A1A1A}
.vm-item-actions{display:flex;gap:8px}
.vm-item-btn{width:30px;height:30px;border-radius:6px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;background:transparent;color:#999;transition:.1s}
.vm-item-btn:hover{background:#F0F0F0}
.vm-item-btn.rename{color:#1A1A1A}
.vm-item-btn.delete{color:#E60012}

/* === Confirm Dialog === */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:2000;display:none;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;padding:24px;width:280px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.confirm-msg{font-size:15px;color:#1A1A1A;margin-bottom:20px;line-height:1.5}
.confirm-actions{display:flex;gap:10px;justify-content:center}
.confirm-btn{padding:8px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.confirm-btn.cancel{background:#F0F0F0;color:#666}
.confirm-btn.danger{background:#E60012;color:#fff}

/* === Back Button === */
.back-btn{display:inline-flex;align-items:center;gap:4px;color:#1A1A1A;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;padding:8px 0;margin-bottom:8px}
.back-btn:hover{opacity:.7}

/* === Modal === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-end;animation:fadeIn .2s ease}
.modal-overlay.show{display:flex}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,10px));animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;color:#1A1A1A}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:#888;margin-bottom:5px;display:block}
.form-row{display:flex;gap:8px;align-items:center}
.form-row .form-group{flex:1;margin-bottom:0}
.form-input,.form-select{width:100%;padding:10px 12px;border:1px solid #DDD;border-radius:8px;font-size:14px;background:#FAFAFA;color:#1A1A1A;outline:none;transition:.15s}
.form-input:focus,.form-select:focus{border-color:#E60012;background:#fff}
.form-input-sm{padding:8px 10px;font-size:14px;text-align:center}
.unit-label{font-size:12px;color:#999;font-weight:500;white-space:nowrap}

/* Multi-select tags */
.tag-grid{display:flex;flex-wrap:wrap;gap:6px}
.tag-opt{padding:6px 14px;border-radius:16px;font-size:12px;background:#F0F0F0;color:#888;cursor:pointer;border:none;font-weight:600;transition:.15s}
.tag-opt.active{background:#E60012;color:#fff}
.tag-opt:active{transform:scale(.95)}

/* Modal buttons */
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-cancel{background:#F0F0F0;color:#888}
.btn-submit{background:#E60012;color:#fff}
.btn-submit:disabled{opacity:.4}
</style>
</head>
<body>

<div class="header">
  <h1><span>Pit</span>Lap</h1>
  <span class="header-badge">DEMO</span>
</div>
<div class="checkered"></div>

<div class="content" id="content">

  <!-- ========== 棣栭〉 ========== -->
  <div class="page active" id="page-home">
    <div class="card vehicle-card">
      <div style="display:flex;gap:16px;align-items:center">
        <div style="flex:1">
          <div class="vehicle-name">Yamaha R3</div>
          <div class="vehicle-sub">321cc 路 42hp</div>
          <div class="vehicle-stats" style="justify-content:center">
            <div class="vehicle-stat" style="flex:none;padding:8px 20px">
              <div class="num" style="font-size:22px">ZIC 1:52.34</div>
              <div class="label">鏈€浣冲湀閫?/div>
            </div>
          </div>
        </div>
        <div style="flex-shrink:0;width:120px;height:80px;border-radius:8px;overflow:hidden;background:#F5F5F5;border:1px solid #E5E5E5;display:flex;align-items:center;justify-content:center">
          <img src="https://imgd.aeplcdn.com/1056x594/bw/models/yamaha-yzf-r3.jpg?20190103151915&q=80" alt="Yamaha R3" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=font-size:32px>馃弽锔?/div>'">
        </div>
      </div>
      <div class="racing-line"></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="dot dot-red"></span>杞儙鐘舵€?/div>
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600">
        <span>Pirelli Diablo Rosso IV</span>
        <span style="color:#E60012">80%</span>
      </div>
      <div class="tire-info" style="margin-top:0">
        <span>鍚庤疆锛?5%</span>
        <span>鏇存崲棰勮锛?5 鑺?/span>
      </div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:3px">
          <span>宸蹭娇鐢?/span>
          <span style="font-weight:600;color:#1A1A1A">4 / 15 鑺?/span>
        </div>
        <div class="tire-bar"><div class="tire-fill good" style="width:27%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px">
          <span style="color:#1A1A1A;font-weight:600">鈼?姝ｅ父</span>
          <span style="color:#E60012;font-size:10px">鎺ヨ繎鏇存崲锛堝墿浣?11 鑺傦級</span>
        </div>
      </div>
    </div>

    <div class="card" id="recent-session">
      <div class="card-title"><span class="dot dot-black"></span>鏈€杩戣禌閬撴棩</div>
    </div>

    <div class="card">
      <div class="card-title"><span class="dot dot-red"></span>鍦堥€熻秼鍔?路 ZIC</div>
      <div class="chart-bars">
        <div class="chart-bar" style="height:80px"><span class="val">1:56.2</span></div>
        <div class="chart-bar" style="height:72px"><span class="val">1:54.8</span></div>
        <div class="chart-bar" style="height:64px"><span class="val">1:53.1</span></div>
        <div class="chart-bar best" style="height:55px"><span class="val">1:52.3</span></div>
        <div class="chart-bar" style="height:58px"><span class="val">1:52.8</span></div>

<script>
// ====== DATA ======
const TARGETS = { 'ZIC': '1:50.000', '瀹佹尝': '1:53.000', '澶╁簻': '2:00.000', '澶╅┈': '' };
const TRACK_SHORT = { 'ZIC':'ZIC','瀹佹尝':'瀹佹尝','澶╅┈':'澶╅┈','澶╁簻':'澶╁簻' };
const TRACK_FULL = { 'ZIC':'鐝犳捣鍥介檯璧涜溅鍦?,'瀹佹尝':'瀹佹尝鍥介檯璧涢亾','澶╅┈':'涓婃捣澶╅┈璧涜溅鍦?,'澶╁簻':'鎴愰兘澶╁簻鍥介檯璧涢亾' };
let vehicles = ['Yamaha R3'];
let nextId = 100;
let records = [
  { id:1, date:'2026-06-16',track:'ZIC',time:'1:53.800',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:2, date:'2026-06-02',track:'瀹佹尝',time:'1:55.142',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:3, date:'2026-05-20',track:'瀹佹尝',time:'1:56.300',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:4, date:'2026-05-15',track:'ZIC',time:'1:52.345',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:5, date:'2026-04-20',track:'瀹佹尝',time:'1:58.672',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:6, date:'2026-03-28',track:'ZIC',time:'1:53.100',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:7, date:'2026-03-10',track:'澶╅┈',time:'1:28.456',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:8, date:'2026-02-20',track:'ZIC',time:'1:54.800',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:9, date:'2026-02-14',track:'澶╁簻',time:'2:05.890',temp:'',cond:[],vehicle:'Yamaha R3' },
  { id:10, date:'2026-01-12',track:'ZIC',time:'1:56.200',temp:'',cond:[],vehicle:'Yamaha R3' },
];

// ====== UTILS ======
function timeToMs(t){ const p=t.split(/[:.]/); return +p[0]*60000+ +p[1]*1000+ +p[2]; }
function msToTime(ms){ const m=Math.floor(ms/60000); const s=Math.floor((ms%60000)/1000); const ms3=ms%1000; return m+':'+String(s).padStart(2,'0')+'.'+String(ms3).padStart(3,'0'); }
function msToSecStr(ms){ const s=Math.floor(ms/1000); const ms3=ms%1000; return s+'.'+String(ms3).padStart(3,'0'); }
function diffStr(t1,t2){ if(!t1||!t2)return''; const d=timeToMs(t2)-timeToMs(t1); const abs=Math.abs(d); return msToSecStr(abs); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sorted(r){ return [...r].sort((a,b)=>b.date.localeCompare(a.date)||timeToMs(a.time)-timeToMs(b.time)); }
function getPB(track){ const r=records.filter(x=>x.track===track); if(!r.length)return null; return r.reduce((a,b)=>timeToMs(a.time)<timeToMs(b.time)?a:b); }
function getTarget(t){ return TARGETS[t]||''; }

// ====== COMPUTE PB CARDS ======
function computeCards(){
  const trackCount={}; const last5=[];
  const s=sorted(records);
  s.forEach((r,i)=>{ trackCount[r.track]=(trackCount[r.track]||0)+1; if(i<5)last5.push(r.track); });
  const recent5={}; last5.forEach(t=>recent5[t]=(recent5[t]||0)+1);
  const tracks=Object.keys(trackCount);
  let mostTrack=null,mostN=0;
  for(const t of tracks){ if(trackCount[t]>mostN){ mostN=trackCount[t]; mostTrack=t; } }
  let hotTrack=null,hotN=0;
  for(const t of tracks){ if(t!==mostTrack&&recent5[t]&&recent5[t]>=3&&recent5[t]>hotN){ hotN=recent5[t]; hotTrack=t; } }
  let firstTrack=null,firstDate='';
  const firstTimes={};
  tracks.forEach(t=>{ const fr=s.filter(x=>x.track===t).pop(); if(fr){ firstTimes[t]=fr.date; } });
  for(const t of tracks){
    if(t===mostTrack||t===hotTrack)continue;
    if(!firstDate||firstTimes[t]>firstDate){ firstDate=firstTimes[t]; firstTrack=t; }
    else if(!firstTrack){ firstTrack=t; firstDate=firstTimes[t]; }
  }
  const cards=[];
  if(mostTrack) cards.push({ type:'most', track:mostTrack, label:'馃弳 寰佹垬鏈€澶?, badge:'most', count:trackCount[mostTrack] });
  if(hotTrack)  cards.push({ type:'hot',  track:hotTrack,  label:'馃敟 鏈€杩戝父鍘?, badge:'hot',  count:'鏈€杩?+(recent5[hotTrack])+'娆? });
  if(firstTrack)cards.push({ type:'new',  track:firstTrack,label:'馃啎 棣栨寰佹湇', badge:'newb',count:'棣栨' });
  return cards;
}

// ====== RENDER HOME (棣栭〉) ======
function renderHome(){
  const v=vehicles[0]||'Yamaha R3';
  const pbAll=records.length?records.reduce((a,b)=>timeToMs(a.time)<timeToMs(b.time)?a:b):null;
  const pbLabel=pbAll?pbAll.track+' '+pbAll.time:'--:--.---';
  document.querySelector('.vehicle-name').textContent=v;
  document.querySelector('.vehicle-stat .num').textContent=pbLabel;
  const img=document.querySelector('.vehicle-card img');
  if(img) img.alt=v;
}

// ====== RENDER RECENT (棣栭〉) ======
function renderRecent(){
  const div=document.getElementById('recent-session');
  const s=sorted(records);
  if(!s.length){ div.innerHTML='<div class="card-title"><span class="dot dot-black"></span>鏈€杩戣禌閬撴棩</div><div style="text-align:center;padding:20px;color:#CCC;font-size:13px">鏆傛棤璁板綍</div>'; return; }
  const last=s[0];
  const pb=getPB(last.track);
  const target=getTarget(last.track);
  const tMs=target?timeToMs(target):0;
  const gap=tMs?diffStr(pb.time,target):'';
  const achieved=tMs?timeToMs(pb.time)<=tMs:false;
  const gapLabel=achieved?'鉁?'+gap+'s':'+'+gap+'s';
  div.innerHTML='<div class="card-title"><span class="dot dot-black"></span>鏈€杩戣禌閬撴棩</div>'
    +'<div class="pb-track" style="font-size:16px;margin-bottom:8px">'+last.track+'</div>'
    +'<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'
    +'<div><span style="font-size:12px;color:#888">鏈€蹇湀</span><div style="font-size:20px;font-weight:800;color:#E60012">'+(pb?pb.time:'--')+'</div></div>'
    +(target?'<div><span style="font-size:12px;color:#888">鐩爣</span><div style="font-size:16px;font-weight:700;color:#1A1A1A">'+target+'</div></div>':'')
    +(gap?'<div><span style="font-size:12px;color:#888">宸窛</span><div style="font-size:22px;font-weight:800;color:'+(achieved?'#00AA55':'#E60012')+'">'+gapLabel+'s</div></div>':'')
    +'</div>'
    +'<div style="margin-top:10px;font-size:11px;color:#999;border-top:1px solid #F0F0F0;padding-top:10px">'+last.date+' 路 '+(last.vehicle||(vehicles[0]||''))+(last.temp?' 路 '+last.temp+'鈩?:'')+(last.cond.length?' 路 '+last.cond.join('/'):'')+'</div>'
    +'<div class="racing-stripe" style="margin-top:8px"></div>';
}

// ====== RENDER ======
function render(){
  const filter=document.querySelector('#page-laps .lap-tag.active')?.dataset?.track||'';
  const r=filter?sorted(records.filter(x=>x.track===filter)):sorted(records);

  // Filters
  const ftags=document.querySelector('#page-laps .lap-tags');
  const uq=[...new Set(records.map(x=>x.track))].sort();
  ftags.innerHTML='<span class="lap-tag active" data-track="">鍏ㄩ儴</span>'+uq.map(t=>'<span class="lap-tag" data-track="'+t+'">'+t+'</span>').join('');
  ftags.querySelectorAll('.lap-tag').forEach(el=>{
    el.addEventListener('click',()=>{
      ftags.querySelectorAll('.lap-tag').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      render();
    });
  });
  if(filter){
    const a=ftags.querySelector('[data-track="'+filter+'"]');
    if(a){ ftags.querySelectorAll('.lap-tag').forEach(x=>x.classList.remove('active')); a.classList.add('active'); }
  }

  // PB Cards
  const pbDiv=document.getElementById('pb-cards');
  pbDiv.innerHTML='';
  const cards=computeCards();
  cards.forEach(c=>{
    const pb=getPB(c.track);
    const target=getTarget(c.track);
    const pbMs=pb?timeToMs(pb.time):0;
    const tMs=target?timeToMs(target):0;
    const gap=tMs?diffStr(pb.time,target):'';
    const achieved=tMs?timeToMs(pb.time)<=timeToMs(target):false;
    const gapLabel=achieved?'鉁?'+gap+'s':'+'+gap+'s';
    pbDiv.innerHTML+='<div class="pb-card">'
      +'<div class="pb-badge '+c.badge+'">'+c.label+' 路 '+c.count+'</div>'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<div style="flex:1">'
      +'<div class="pb-track">'+c.track+'</div>'
      +'<div class="pb-time">'+(pb?pb.time:'--:--.---')+'</div>'
      +'</div>'
      +(target?'<div style="text-align:right"><div style="font-size:12px;color:#888;font-weight:500">鐩爣</div><div style="font-size:15px;font-weight:700;color:#1A1A1A">'+target+'</div></div>':'')
      +'</div>'
      +(gap?'<div style="display:flex;align-items:center;margin-top:4px;gap:6px">'
        +'<span class="pb-gap '+(achieved?'green':'red')+'">'+gapLabel+'s</span>'
        +'<span style="font-size:11px;color:#888;font-weight:500">'+(achieved?'馃帀 宸茶揪鎴愮洰鏍囷紒寤鸿璁惧畾鏂扮洰鏍?:'璺濈洰鏍?)+'</span>'
        +'</div>':'')
      +(c.type==='new' && !target?'<div style="margin-top:4px;font-size:11px;color:#E60012;font-weight:600">馃挕 寤鸿璁惧畾鐩爣鍦堥€?/div>':'')
      +'</div>';
  });

  // Lap List
  const listDiv=document.getElementById('lap-list');
  listDiv.innerHTML='';
  if(!r.length){ listDiv.innerHTML='<div style="text-align:center;padding:20px;color:#CCC;font-size:13px">鏆傛棤璁板綍</div>'; return; }
  r.forEach(rec=>{
    listDiv.innerHTML+='<div class="lap-list-item">'
      +'<div class="lap-list-main">'
      +'<div class="lli-left"><span class="lli-date">'+rec.date+'</span><span class="lli-track">'+rec.track+'</span><span class="lli-vehicle">'+(rec.vehicle||(vehicles[0]||''))+(rec.temp?' 路 '+rec.temp+'鈩?:'')+(rec.cond.length?' 路 '+rec.cond.join('/'):'')+'</span></div>'
      +'</div>'
      +'<div class="lap-list-right">'
      +'<div class="lli-time">'+rec.time+'</div>'
      +'<button class="lli-btn edit" data-id="'+rec.id+'" title="缂栬緫" style="margin-left:6px">鉁?/button>'
      +'</div>'
      +'</div>';
  });
  // Attach edit events
  listDiv.querySelectorAll('.lli-btn.edit').forEach(b=>b.addEventListener('click',()=>openModal(+b.dataset.id)));
}

// ====== MODAL ======
const modal=document.getElementById('modal');
const fabBtn=document.getElementById('fab');
let selectedCond=[];
let editingId=null;

function populateVehicleSelect(selId, selectedVal){
  const sel=document.getElementById(selId);
  sel.innerHTML='<option value="">閫夋嫨杞﹁締</option>'+vehicles.map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'<option value="__other__">鍏朵粬锛堟墜鍔ㄥ～鍐欙級</option>';
  if(selectedVal && vehicles.includes(selectedVal)){ sel.value=selectedVal; document.getElementById('f-vehicle-other').style.display='none'; }
  else if(selectedVal){ sel.value='__other__'; document.getElementById('f-vehicle-other').style.display='block'; document.getElementById('f-vehicle-other').value=selectedVal; }
  else{ sel.value=''; document.getElementById('f-vehicle-other').style.display='none'; }
}

document.getElementById('f-vehicle').addEventListener('change',function(){
  if(this.value==='__other__'){ document.getElementById('f-vehicle-other').style.display='block'; }
  else{ document.getElementById('f-vehicle-other').style.display='none'; }
});

function openModal(recId){
  editingId=recId||null;
  selectedCond=[];
  document.querySelectorAll('#f-conditions .tag-opt').forEach(x=>x.classList.remove('active'));

  const sel=document.getElementById('f-track');
  const fullList=['ZIC','瀹佹尝','澶╅┈','澶╁簻'];
  sel.innerHTML='<option value="">璇烽€夋嫨璧涢亾</option>'+fullList.map(t=>'<option value="'+t+'">'+TRACK_FULL[t]+'</option>').join('');

  document.getElementById('target-hint').textContent='';

  if(recId){
    // Edit mode
    const rec=records.find(x=>x.id===recId);
    if(!rec)return;
    document.getElementById('modal-title').textContent='缂栬緫鍦堥€?;
    sel.value=rec.track;
    document.getElementById('f-date').value=rec.date;
    populateVehicleSelect('f-vehicle', rec.vehicle);
    const tp=rec.time.split(/[:.]/);
    document.getElementById('f-min').value=tp[0];
    document.getElementById('f-sec').value=tp[1];
    document.getElementById('f-ms').value=tp[2];
    const target=getTarget(rec.track);
    if(target){
      const tparts=target.split(/[:.]/);
      document.getElementById('t-min').value=tparts[0];
      document.getElementById('t-sec').value=tparts[1];
      document.getElementById('t-ms').value=tparts[2];
      document.getElementById('target-hint').textContent='褰撳墠鐩爣 '+target;
    } else {
      document.getElementById('t-min').value=''; document.getElementById('t-sec').value=''; document.getElementById('t-ms').value='';
    }
    if(rec.temp){
      const tempParts=rec.temp.split('~');
      document.getElementById('f-temp-min').value=tempParts[0]!=='?'?tempParts[0]:'';
      document.getElementById('f-temp-max').value=tempParts[1]!=='?'?tempParts[1]:'';
    } else {
      document.getElementById('f-temp-min').value=''; document.getElementById('f-temp-max').value='';
    }
    (rec.cond||[]).forEach(c=>{
      const tag=document.querySelector('#f-conditions .tag-opt[data-val="'+c+'"]');
      if(tag){ tag.classList.add('active'); selectedCond.push(c); }
    });
    document.getElementById('modal-submit').textContent='淇濆瓨淇敼';
    document.getElementById('modal-delete-area').style.display='block';
  } else {
    // New mode
    document.getElementById('modal-title').textContent='鏂板鍦堥€?;
    document.getElementById('modal-delete-area').style.display='none';
    document.getElementById('f-date').value=today();
    document.getElementById('f-min').value=''; document.getElementById('f-sec').value=''; document.getElementById('f-ms').value='';
    document.getElementById('t-min').value=''; document.getElementById('t-sec').value=''; document.getElementById('t-ms').value='';
    document.getElementById('f-temp-min').value=''; document.getElementById('f-temp-max').value='';
    populateVehicleSelect('f-vehicle', vehicles[0]||'');
    document.getElementById('modal-submit').textContent='鎻愪氦';
    document.getElementById('f-track').value='';
  }

  modal.classList.add('show');
}

function closeModal(){ modal.classList.remove('show'); editingId=null; }

fabBtn.addEventListener('click',()=>openModal(null));
document.getElementById('modal-cancel').addEventListener('click',closeModal);
document.getElementById('modal-delete-btn').addEventListener('click',function(){
  if(editingId){ showConfirm(editingId); closeModal(); }
});
modal.addEventListener('click',e=>{ if(e.target===modal)closeModal(); });

// Track selection auto-fills target
document.getElementById('f-track').addEventListener('change',function(){
  const t=this.value;
  const hint=document.getElementById('target-hint');
  if(t && TARGETS[t]){
    const parts=TARGETS[t].split(/[:.]/);
    document.getElementById('t-min').value=parts[0];
    document.getElementById('t-sec').value=parts[1];
    document.getElementById('t-ms').value=parts[2];
    hint.textContent='娌跨敤涓婃鐩爣 '+TARGETS[t];
  } else if(t && !TARGETS[t]){
    hint.textContent='寤鸿璁惧畾鐩爣鍦堥€?;
    document.getElementById('t-min').value=''; document.getElementById('t-sec').value=''; document.getElementById('t-ms').value='';
  } else {
    hint.textContent='';
  }
});

// Condition multi-select
document.querySelectorAll('#f-conditions .tag-opt').forEach(el=>{
  el.addEventListener('click',()=>{
    const v=el.dataset.val;
    if(el.classList.contains('active')){ el.classList.remove('active'); selectedCond=selectedCond.filter(x=>x!==v); }
    else { el.classList.add('active'); selectedCond.push(v); }
  });
});

// Submit
document.getElementById('modal-submit').addEventListener('click',function(){
  const track=document.getElementById('f-track').value;
  const min=document.getElementById('f-min').value;
  const sec=document.getElementById('f-sec').value;
  const ms=document.getElementById('f-ms').value;
  const tMin=document.getElementById('t-min').value;
  const tSec=document.getElementById('t-sec').value;
  const tMs=document.getElementById('t-ms').value;
  const tempMin=document.getElementById('f-temp-min').value;
  const tempMax=document.getElementById('f-temp-max').value;

  if(!track||!min||sec===''||ms===''){ alert('璇峰～鍐欒禌閬撳拰鍦堥€?); return; }
  const secNum=+sec; const msNum=+ms;
  if(secNum>59||msNum>999){ alert('绉掓暟涓嶈兘瓒呰繃59锛屾绉掍笉鑳借秴杩?99'); return; }

  const time=min+':'+String(secNum).padStart(2,'0')+'.'+String(msNum).padStart(3,'0');

  // Vehicle
  let vehicle=document.getElementById('f-vehicle').value;
  if(vehicle==='__other__'){ vehicle=document.getElementById('f-vehicle-other').value.trim(); }
  if(!vehicle){ alert('璇烽€夋嫨鎴栬緭鍏ヨ溅杈?); return; }
  if(!vehicles.includes(vehicle)){ vehicles.push(vehicle); }

  // Target
  if(tMin!==''&&tSec!==''&&tMs!==''){
    TARGETS[track]=tMin+':'+String(+tSec).padStart(2,'0')+'.'+String(+tMs).padStart(3,'0');
  }

  const temp=tempMin||tempMax?(tempMin||'?')+'~'+(tempMax||'?'):'';
  const cond=[...selectedCond];
  const date=document.getElementById('f-date').value||today();

  if(editingId){
    const idx=records.findIndex(x=>x.id===editingId);
    if(idx!==-1){
      records[idx]={ ...records[idx], date, track, time, temp, cond, vehicle };
    }
  } else {
    records.push({ id:++nextId, date, track, time, temp, cond, vehicle });
  }

  closeModal();
  render();
  renderHome();
  renderRecent();
  renderLeaderboard();
});

// ====== CONFIRM DIALOG ======
let confirmCallback=null;
const confirmEl=document.getElementById('confirm');
function showConfirm(id){
  document.getElementById('confirm-msg').textContent='纭畾鍒犻櫎璇ュ湀閫熻褰曪紵';
  confirmEl.classList.add('show');
  confirmCallback=()=>{ deleteRecord(id); };
}
document.getElementById('confirm-cancel').addEventListener('click',()=>{ confirmEl.classList.remove('show'); confirmCallback=null; });
document.getElementById('confirm-ok').addEventListener('click',()=>{ if(confirmCallback)confirmCallback(); confirmEl.classList.remove('show'); confirmCallback=null; });

function deleteRecord(id){
  records=records.filter(x=>x.id!==id);
  render();
  renderHome();
  renderRecent();
  renderLeaderboard();
}

// ====== VEHICLE MANAGEMENT ======
let inVehicleMgmt=false;
function showVehicleMgmt(){
  inVehicleMgmt=true;
  document.getElementById('page-mine').classList.remove('active');
  document.getElementById('page-vehicle-mgmt').classList.add('active');
  renderVehicleMgmt();
}
function hideVehicleMgmt(){
  inVehicleMgmt=false;
  document.getElementById('page-vehicle-mgmt').classList.remove('active');
  document.getElementById('page-mine').classList.add('active');
}
function renderVehicleMgmt(){
  const list=document.getElementById('vm-list');
  list.innerHTML='';
  vehicles.forEach((v,i)=>{
    list.innerHTML+='<div class="vm-item"><span class="vm-item-name">'+v+'</span><div class="vm-item-actions"><button class="vm-item-btn rename" data-idx="'+i+'">鉁?/button><button class="vm-item-btn delete" data-idx="'+i+'">鉁?/button></div></div>';
  });
  list.querySelectorAll('.vm-item-btn.rename').forEach(b=>b.addEventListener('click',()=>renameVehicle(+b.dataset.idx)));
  list.querySelectorAll('.vm-item-btn.delete').forEach(b=>b.addEventListener('click',()=>deleteVehicle(+b.dataset.idx)));
}
function renameVehicle(idx){
  const newName=prompt('杈撳叆鏂板悕绉帮細', vehicles[idx]);
  if(newName && newName.trim() && newName.trim()!==vehicles[idx]){
    const oldName=vehicles[idx];
    vehicles[idx]=newName.trim();
    records.forEach(r=>{ if(r.vehicle===oldName)r.vehicle=newName.trim(); });
    renderVehicleMgmt();
    render(); renderHome(); renderRecent();
  }
}
function deleteVehicle(idx){
  if(vehicles.length<=1){ alert('鑷冲皯淇濈暀涓€杈嗚溅'); return; }
  if(!confirm('纭畾鍒犻櫎 "'+vehicles[idx]+'"锛熷湀閫熻褰曚腑鐨勮溅杈嗕俊鎭皢琚竻绌恒€?))return;
  const oldName=vehicles[idx];
  vehicles.splice(idx,1);
  records.forEach(r=>{ if(r.vehicle===oldName)r.vehicle=''; });
  renderVehicleMgmt();
  render(); renderHome(); renderRecent();
}
function addVehicle(){
  const name=prompt('杈撳叆鏂拌溅鍚嶇О锛?);
  if(name && name.trim() && !vehicles.includes(name.trim())){
    vehicles.push(name.trim());
    renderVehicleMgmt();
  } else if(name && vehicles.includes(name.trim())){
    alert('璇ヨ溅杈嗗凡瀛樺湪');
  }
}

// ====== LEADERBOARD ======
const LB_RIDERS = [
  { name:'馃弫 閽㈤搧渚?, avatar:'鈿?, vehicle:'Yamaha R6' },
  { name:'馃弫 闂數渚?, avatar:'馃敟', vehicle:'Kawasaki ZX-6R' },
  { name:'馃弫 杩介鑰?, avatar:'馃尓', vehicle:'Honda CBR600RR' },
  { name:'馃弫 鏋侀€熺媯', avatar:'馃憫', vehicle:'Suzuki GSX-R600' },
  { name:'馃弫 寮亾鐜?, avatar:'馃挮', vehicle:'Yamaha R6' },
  { name:'馃弫 鏃犲奖鎵?, avatar:'馃挜', vehicle:'Kawasaki ZX-6R' },
  { name:'馃弫 婕傜Щ甯?, avatar:'馃寑', vehicle:'Honda CBR600RR' },
  { name:'馃弫 璧涜溅榄?, avatar:'馃弾', vehicle:'Yamaha R6' },
];
function renderLeaderboard(){
  const trackSel=document.getElementById('lb-tracks');
  const trackNames=['ZIC','瀹佹尝','澶╅┈','澶╁簻'];
  const lbTrack=trackSel.dataset.selected||'ZIC';
  trackSel.innerHTML=trackNames.map(t=>'<button class="lb-track-btn'+(t===lbTrack?' active':'')+'" data-track="'+t+'">'+t+'</button>').join('');
  trackSel.querySelectorAll('.lb-track-btn').forEach(b=>b.addEventListener('click',()=>{
    trackSel.dataset.selected=b.dataset.track;
    renderLeaderboard();
  }));

  const list=document.getElementById('lb-list');
  list.innerHTML='';
  // Generate virtual leaderboard data
  const base=timeToMs('1:55.000');
  const data=LB_RIDERS.map((r,i)=>{
    const diff=i*350+Math.floor(Math.random()*200);
    const t=base+diff;
    return { ...r, time:msToTime(t), gap:i===0?'--':msToTime(base-(base+diff)) };
  });
  data.forEach((r,i)=>{
    const rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'other';
    list.innerHTML+='<div class="lb-card">'
      +'<div class="lb-rank '+rankClass+'">'+(i+1)+'</div>'
      +'<div class="lb-avatar">'+r.avatar+'</div>'
      +'<div class="lb-info"><div class="lb-name">'+r.name+'</div><div class="lb-vehicle">'+r.vehicle+'</div></div>'
      +'<div class="lb-right"><div class="lb-time">'+r.time+'</div><div class="lb-gap">'+(i===0?'PB':'+'+r.gap+'s')+'</div></div>'
      +'</div>';
  });
}

// ====== INIT ======
renderHome();
render();
renderRecent();
renderLeaderboard();

const tabs = document.querySelectorAll('.tab');
const fab = document.getElementById('fab');
fab.style.display = 'none';
const fabPages = ['laps', 'mods', 'expenses'];
const pages = {
  home: document.getElementById('page-home'),
  laps: document.getElementById('page-laps'),
  mods: document.getElementById('page-mods'),
  expenses: document.getElementById('page-expenses'),
  leaderboard: document.getElementById('page-leaderboard'),
  mine: document.getElementById('page-mine'),
};

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    if(inVehicleMgmt)hideVehicleMgmt();
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[tab.dataset.page].classList.add('active');
    document.getElementById('content').scrollTop = 0;
    fab.style.display = fabPages.includes(tab.dataset.page) ? 'flex' : 'none';
    if(tab.dataset.page==='laps')render();
    if(tab.dataset.page==='home'){ renderHome(); renderRecent(); }
    if(tab.dataset.page==='leaderboard')renderLeaderboard();
  });
});

document.querySelectorAll('.mod-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    tag.parentElement.querySelectorAll('.mod-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
  });
});
